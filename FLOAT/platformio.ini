; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-S3 WROOM. Serial console runs over native USB-CDC, so the HC-12 can use
; Serial1 on GPIO43/44 — that requires ARDUINO_USB_CDC_ON_BOOT=1 (set below).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
 -D ARDUINO_USB_CDC_ON_BOOT=1
; SENSOR + METHOD build: the Keller LD is present (CONTROL_USES_SENSOR=false means
; its data is ignored for control, but the code still inits/reads it), so the
; depth-sensor library is required.
lib_deps =
 https://github.com/bluerobotics/BlueRobotics_KellerLD_Library.git
